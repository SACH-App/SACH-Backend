version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - NADRA_API_URL=${NADRA_API_URL}
      - NADRA_PARTNER_KEY=${NADRA_PARTNER_KEY}
    depends_on:
      - redis
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
