# ─────────────────────────────────────────────────────────────
# Docker Compose — for LOCAL DEVELOPMENT only
# In production (Render), only the Dockerfile is used.
# ─────────────────────────────────────────────────────────────

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app          # Live-reload: changes on your PC show up instantly
    env_file:
      - .env             # Reads all vars from your .env file automatically
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
